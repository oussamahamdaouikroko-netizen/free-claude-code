# PharmaGestion DZ — Windows installer (NSIS), built with electron-builder.
#
# The application is fully offline: nothing is downloaded at runtime, no
# telemetry, no update server, no external service.
#
# Build:  npm run dist        → release/PharmaGestion-DZ-Setup.exe
# Check:  npm run pack        → unpacked folder in release/win-unpacked

appId: dz.pharmagestion.desktop
productName: PharmaGestion DZ
copyright: Copyright © 2026 PharmaGestion DZ

directories:
  output: release
  buildResources: assets

# Only what the application needs at runtime. Tests, documentation, design
# fixtures and the icon generator must never end up inside the installer.
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/README*"
  - "!**/docs/**"
  - "!**/tests/**"
  - "!**/fixtures/**"
  - "!**/scripts/**"
  - "!**/.github/**"

asar: true

# better-sqlite3 is a Node-API (N-API) addon: its prebuilt binary is loaded at
# runtime, which requires a real .node file on disk (it cannot run from inside
# an asar archive).
asarUnpack:
  - node_modules/better-sqlite3/**

# No native rebuild: better-sqlite3 v13 ships N-API prebuilds that are valid in
# both Node and Electron (checked by tests/packaging.test.js). This keeps the
# Windows build deterministic and does not require a C++ toolchain in CI.
npmRebuild: false
buildDependenciesFromSource: false

# Keeps only the win32-x64 prebuild in the package and fails the build if it is
# missing, so a broken installer is never published.
afterPack: scripts/after-pack.js

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  # Exactly the file name the pharmacy expects.
  artifactName: PharmaGestion-DZ-Setup.exe
  legalTrademarks: PharmaGestion DZ
  # A per-user install must not ask for administrator rights.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PharmaGestion DZ
  uninstallDisplayName: PharmaGestion DZ
  # Uninstalling must never delete the pharmacy's inventory, debts or history:
  # the database lives in %APPDATA%\PharmaGestion DZ\data, not in the install
  # folder, and this flag makes that explicit.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - fr_FR
    - ar_SA
  language: "1036"
  license: LICENSE.txt
  # The uninstaller is always generated by electron-builder; there is no
  # `createUninstaller` option (that key is rejected by the schema).
