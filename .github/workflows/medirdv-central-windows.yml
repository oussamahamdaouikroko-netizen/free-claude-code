name: Build Medirdv Central for Windows

# Produces release/windows/Medirdv-Central-Setup-<version>.exe (Electron + NSIS).
#
# Triggers:
#  - pull_request  (builds so reviewers can download the installer)
#  - push to main/master and to medirdv-central-v* tags
#  - workflow_dispatch (manual, once this file is on the default branch)
#
# The installer is uploaded as an artifact on every run, and attached to a
# GitHub Release when a tag is pushed or the run is dispatched with
# `release: true`.

on:
  push:
    branches: [main, master]
    tags: ["medirdv-central-v*"]
    paths:
      - "medirdv-central/**"
      - ".github/workflows/medirdv-central-windows.yml"
  pull_request:
    paths:
      - "medirdv-central/**"
      - ".github/workflows/medirdv-central-windows.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the built installer to a GitHub Release"
        type: boolean
        default: false
      api_base:
        description: "Central server URL baked into the desktop app"
        type: string
        default: "https://central.medirdv.dz"

permissions:
  contents: write

concurrency:
  group: medirdv-central-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: medirdv-central

jobs:
  test:
    name: Central test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  build:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medirdv-central/package.json

      - name: Install build tooling
        run: npm install --no-audit --no-fund

      - name: Generate icon (.ico)
        run: node scripts/convert-icon.js

      - name: Prepare Electron wrapper
        shell: bash
        run: |
          API_BASE="${{ inputs.api_base || 'https://central.medirdv.dz' }}"
          node scripts/build-windows.js --api-base "$API_BASE"

      - name: Install wrapper dependencies
        working-directory: medirdv-central/release/windows-app
        run: |
          npm install --no-audit --no-fund
          # Electron's embedded Node may not expose node:sqlite; the server has
          # a better-sqlite3 fallback. Installed here so it is packaged.
          npm install --no-audit --no-fund --save better-sqlite3@^11

      - name: Smoke-test the bundled server inside Electron
        working-directory: medirdv-central/release/windows-app
        shell: bash
        run: |
          cat > smoke.js <<'JS'
          const { app } = require('electron');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');

          app.disableHardwareAcceleration();

          app.whenReady().then(async () => {
            const out = [];
            const log = (line) => { out.push(line); console.log('[smoke]', line); };
            try {
              log('electron=' + process.versions.electron + ' node=' + process.versions.node);
              const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'mdc-smoke-'));
              process.env.MEDIRDV_DB_PATH = path.join(tmp, 'smoke.sqlite');
              process.env.MEDIRDV_RECEIPTS_DIR = path.join(tmp, 'receipts');
              process.env.MEDIRDV_ENCRYPTION_KEY = require('node:crypto').randomBytes(32).toString('hex');
              process.env.MEDIRDV_BOOTSTRAP_ADMIN_EMAIL = 'smoke@medirdv.local';
              process.env.MEDIRDV_BOOTSTRAP_ADMIN_PASSWORD = 'smoke-pass-123';

              const sqlite = require('./server/src/sqlite');
              const driver = sqlite.resolveDriver();
              log('sqlite driver=' + driver.name);

              const { start } = require('./server/src/server');
              const server = start({ port: 0, host: '127.0.0.1' });
              await new Promise((resolve, reject) => {
                server.once('listening', resolve);
                server.once('error', reject);
                setTimeout(() => reject(new Error('server did not listen in 20s')), 20000);
              });
              const base = server.baseUrl;
              log('server listening ' + base);

              const health = await fetch(base + '/health').then((r) => r.json());
              log('health ok=' + health.ok);
              const doctors = await fetch(base + '/api/public/doctors').then((r) => r.json());
              log('public API doctors=' + (doctors.doctors || []).length);

              const loginRes = await fetch(base + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'smoke@medirdv.local', password: 'smoke-pass-123' }),
              });
              const login = await loginRes.json();
              log('admin login status=' + loginRes.status + ' role=' + (login.user && login.user.role));

              const admin = await fetch(base + '/admin/');
              log('admin UI status=' + admin.status);

              const ok = health.ok === true && loginRes.status === 200;
              log(ok ? 'SMOKE RESULT: PASS' : 'SMOKE RESULT: FAIL');
              fs.writeFileSync('smoke-result.txt', out.join('\n'));
              server.close();
              app.exit(ok ? 0 : 1);
            } catch (error) {
              log('ERROR ' + (error && error.stack ? error.stack : error));
              fs.writeFileSync('smoke-result.txt', out.join('\n'));
              app.exit(1);
            }
          });
          JS
          # Electron needs a display on Windows runners; it has one. Run and capture.
          npx electron smoke.js 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          echo "--- smoke-result.txt ---"
          cat smoke-result.txt 2>/dev/null || cat smoke.log
          {
            echo "===== smoke.log (tail) ====="
            tail -n 60 smoke.log 2>/dev/null || true
            echo "===== smoke-result.txt ====="
            cat smoke-result.txt 2>/dev/null || true
          } > /tmp/mdc-win-diag.txt

          # Surface the cause as a workflow annotation (visible without log access).
          head -c 900 /tmp/mdc-win-diag.txt | tr '\n' ' ' | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error title=Electron smoke diagnostics::$line"
          done

          # Publish the cause through the Checks API: environments that cannot
          # download artifacts or logs can still read annotations.
          node -e "
            const fs=require('fs');
            const text=fs.readFileSync('/tmp/mdc-win-diag.txt','utf8').slice(0,6000);
            fs.writeFileSync('/tmp/check.json', JSON.stringify({
              name:'windows-smoke-diagnostics',
              head_sha:process.env.GITHUB_SHA,
              status:'completed',
              conclusion:'neutral',
              output:{title:'Electron smoke diagnostics',summary:text}
            }));
          " || true
          curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs"             --data-binary @/tmp/check.json >/dev/null 2>&1 || echo "note: diagnostics check not created"

          grep -iE "error|cannot|undefined|not a function|no such|failed" /tmp/mdc-win-diag.txt | head -n 6 | while IFS= read -r line; do
            echo "::error title=Electron smoke::$line"
          done
          if [ "$status" -ne 0 ] || ! grep -q "SMOKE RESULT: PASS" smoke-result.txt 2>/dev/null; then
            echo "::error title=Electron smoke test::The bundled server did not work inside Electron"
            exit 1
          fi

      - name: Build NSIS installer
        working-directory: medirdv-central/release/windows-app
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify installer exists
        shell: bash
        run: |
          ls -la release/windows/
          count=$(ls release/windows/*.exe 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "::error::electron-builder reported success but produced no .exe"
            exit 1
          fi

      - name: Write checksums and release notes
        shell: bash
        run: |
          cd release/windows
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256
          {
            echo "# Medirdv Central — Windows build"
            echo
            echo "Version: $(node -p "require('../../package.json').version")"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%FT%TZ)"
            echo
            cat *.sha256
          } > BUILD-INFO.md
          cat BUILD-INFO.md

      - uses: actions/upload-artifact@v4
        with:
          name: Medirdv-Central-Setup-windows
          path: |
            medirdv-central/release/windows/*.exe
            medirdv-central/release/windows/*.sha256
            medirdv-central/release/windows/BUILD-INFO.md
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('medirdv-central-build-{0}', github.run_number) }}
          name: Medirdv Central ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            medirdv-central/release/windows/*.exe
            medirdv-central/release/windows/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
