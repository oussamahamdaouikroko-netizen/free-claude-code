name: Build MediRDV for Windows

# Free Windows builds on GitHub-hosted runners:
#  - push a tag medirdv-v*  → published GitHub Release with MediRDV-Setup-*.exe & MediRDV-Demo-*.exe
#  - pull request           → downloadable artifact, keeps its build log for 30 days
#  - manual run             → same as main
on:
  push:
    tags: ["medirdv-v*"]
    branches: [main, master]
    paths:
      - "medirdv/**"
      - ".github/workflows/medirdv-windows.yml"
  pull_request:
    paths:
      - "medirdv/**"
      - ".github/workflows/medirdv-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medirdv-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: medirdv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medirdv/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run tests
        run: npm test

  build:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: medirdv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medirdv/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Windows)
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::MediRDV tests failed on Windows"
            grep -E "^not ok|^# (tests|pass|fail)|Error|error" test-output.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Build NSIS installer
        shell: bash
        run: |
          set +e
          npx electron-builder --win nsis --x64 --publish never 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::MediRDV installer build failed on Windows (exit $status)"
            grep -nE '⨯|Error|error|Cannot|cannot|failed|ERR!' build-output.log \
              | tail -8 | while IFS= read -r line; do
                echo "::error::$line"
              done
            exit "$status"
          fi

      - name: Build portable demo (sales tool)
        run: npx electron-builder --win --config electron-builder.demo.yml --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediRDV-Setup-windows
          path: |
            medirdv/release/MediRDV-Setup-*.exe
            medirdv/release/MediRDV-Setup-*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediRDV-Demo-portable
          path: medirdv/release/MediRDV-Demo-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/medirdv-v')
        uses: softprops/action-gh-release@v2
        with:
          name: MediRDV ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            medirdv/release/MediRDV-Setup-*.exe
            medirdv/release/MediRDV-Demo-*.exe
          body_path: medirdv/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
