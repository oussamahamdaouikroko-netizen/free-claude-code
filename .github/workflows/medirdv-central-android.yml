name: Build Medirdv Patient for Android

# Produces release/android/Medirdv-Patient.apk (Capacitor + Android SDK).
# Same trigger policy as the Windows workflow.

on:
  push:
    branches: [main, master]
    tags: ["medirdv-central-v*"]
    paths:
      - "medirdv-central/**"
      - ".github/workflows/medirdv-central-android.yml"
  pull_request:
    paths:
      - "medirdv-central/**"
      - ".github/workflows/medirdv-central-android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the built APK to a GitHub Release"
        type: boolean
        default: false
      api_base:
        description: "Central server URL baked into the APK"
        type: string
        default: "https://central.medirdv.dz"

permissions:
  contents: write

concurrency:
  group: medirdv-central-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: medirdv-central

jobs:
  test:
    name: Central test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  build:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medirdv-central/package.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK (pre-installed on the runner)
        shell: bash
        run: |
          set -euo pipefail
          # The ubuntu-latest image ships the Android SDK; the third-party
          # setup action proved unreliable, so configure it directly.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found (looked in $SDK)"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using SDK at $SDK"
          ls "$SDK" || true
          ls "$SDK/platforms" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > /tmp/sdk-location.txt


      - name: Prepare app bundle, config and icons
        shell: bash
        run: |
          # Leave the base unset unless explicitly provided, so the app asks
          # the patient for the Medirdv server address on first launch.
          API_BASE="${{ inputs.api_base }}"
          if [ -n "$API_BASE" ]; then
            node scripts/build-android.js --api-base "$API_BASE"
          else
            node scripts/build-android.js
          fi

      - name: Install app dependencies
        working-directory: medirdv-central/release/android-app
        run: |
          npm install --no-audit --no-fund
          npx cap --version

      - name: Add Android platform
        shell: bash
        working-directory: medirdv-central/release/android-app
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee cap-add.log

      - name: Apply icon, permissions and app metadata
        shell: bash
        working-directory: medirdv-central/release/android-app
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          # Launcher icons generated by our build script.
          cp -r android-res/mipmap-* "$RES"/ 2>/dev/null || true
          mkdir -p "$RES/drawable"
          cp android-res/drawable/splash.png "$RES/drawable/" 2>/dev/null || true

          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Minimal permissions only (INTERNET is already declared by Capacitor).
          if ! grep -q 'POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          # No backups of patient identifiers to Google cloud.
          if ! grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's|android:label="@string/app_name"|android:label="@string/app_name"\n        android:allowBackup="false"\n        android:usesCleartextTraffic="false"|' "$MANIFEST"
          fi
          echo "--- manifest permissions ---"
          grep -n 'uses-permission\|allowBackup\|usesCleartext' "$MANIFEST" || true

      - name: Sync web assets
        working-directory: medirdv-central/release/android-app
        run: npx cap sync android

      - name: Build release APK
        shell: bash
        working-directory: medirdv-central/release/android-app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log | tail -n 80

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release/android
          APK=$(find release/android-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle produced no APK"
            exit 1
          fi
          cp "$APK" release/android/Medirdv-Patient.apk
          ls -la release/android/
          cd release/android
          sha256sum Medirdv-Patient.apk > Medirdv-Patient.apk.sha256
          cat Medirdv-Patient.apk.sha256
          {
            echo "# Medirdv Patient — Android build"
            echo
            echo "Version: $(node -p "require('../../package.json').version")"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%FT%TZ)"
            echo "Package: dz.medirdv.patient"
            echo
            cat Medirdv-Patient.apk.sha256
          } > BUILD-INFO.md

      - name: Verify APK structure
        shell: bash
        run: |
          # Sanity-check the artifact really is an installable package.
          python3 - <<'PY'
          import zipfile, sys
          path = 'release/android/Medirdv-Patient.apk'
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
          required = ['AndroidManifest.xml', 'classes.dex', 'resources.arsc']
          missing = [r for r in required if r not in names]
          if missing:
              print(f"::error::APK missing {missing}")
              sys.exit(1)
          print(f"APK OK: {len(names)} entries, manifest+dex+resources present")
          PY

      - name: Report build diagnostics
        if: always()
        shell: bash
        run: |
          LOGDIR="medirdv-central/release/android-app"
          OUT=/tmp/ci-diag.txt
          : > "$OUT"
          for log in cap-add.log gradle.log; do
            echo "===== $log =====" >> "$OUT"
            if [ -f "$LOGDIR/$log" ]; then
              tail -n 40 "$LOGDIR/$log" >> "$OUT" 2>&1
            else
              echo "(missing)" >> "$OUT"
            fi
          done
          echo "===== environment =====" >> "$OUT"
          node --version >> "$OUT" 2>&1
          java -version >> "$OUT" 2>&1
          echo "SDK=${ANDROID_SDK_ROOT:-unset}" >> "$OUT"
          ls "${ANDROID_SDK_ROOT:-/nonexistent}" >> "$OUT" 2>&1 || true
          echo "===== tree =====" >> "$OUT"
          find "$LOGDIR" -maxdepth 2 -name "*.json" -o -maxdepth 2 -name "*.gradle*" >> "$OUT" 2>&1 || true
          echo "===== end =====" >> "$OUT"

          echo "Diagnostics captured at $OUT"
          cat "$OUT"

          # Make the tail visible through the Checks API, which is the only
          # channel reachable from environments that cannot download logs.
          sha="$GITHUB_SHA"
          title=$(head -c 40 "$OUT" | tr '\n' ' ')
          body=$(head -c 600 "$OUT" | tr '\n' ' ')
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            -d "$(node -e "
              const fs=require('fs');
              const text=fs.readFileSync('/tmp/ci-diag.txt','utf8').slice(0,6000);
              process.stdout.write(JSON.stringify({
                name:'android-diagnostics',
                head_sha:process.env.GITHUB_SHA,
                status:'completed',
                conclusion:'neutral',
                output:{title:'Android build diagnostics',summary:text}
              }));
            ")" >/dev/null 2>&1 || echo "note: diagnostics check-run not created"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            medirdv-central/release/android-app/cap-add.log
            medirdv-central/release/android-app/package.json
            medirdv-central/release/android-app/capacitor.config.json
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Medirdv-Patient-android
          path: |
            medirdv-central/release/android/Medirdv-Patient.apk
            medirdv-central/release/android/Medirdv-Patient.apk.sha256
            medirdv-central/release/android/BUILD-INFO.md
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('medirdv-central-build-{0}', github.run_number) }}
          name: Medirdv Central ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            medirdv-central/release/android/Medirdv-Patient.apk
            medirdv-central/release/android/Medirdv-Patient.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
