<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Portfolio</title>
<meta name="description" content="A video portfolio — films, edits and reels." />
<meta name="theme-color" content="#08080a" />
<meta property="og:title" content="Video Portfolio" />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0b0c'/><path d='M40 30l26 20-26 20z' fill='%23ff5a3c'/></svg>" />
<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="brand" href="#top">
    <span class="brand-logo" id="brandLogo" aria-hidden="true"></span>
    <span class="brand-name" id="brandName">Your Name</span>
  </a>
  <nav class="nav-links">
    <a href="#work">Work</a>
    <a href="#reels" data-if="reels">Reels</a>
    <a href="#about">About</a>
    <a class="nav-cta" href="#contact">Let's talk</a>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <p class="eyebrow" id="heroRole">Videographer &amp; Editor</p>
    <h1 class="hero-title" id="heroName">Your Name</h1>
    <p class="hero-tagline" id="heroTagline">I turn moments into films.</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="#work">Watch the work</a>
      <a class="btn btn-ghost" href="#contact">Book a project</a>
    </div>
    <div class="hero-meta">
      <span id="heroLocation"></span>
      <span class="dot" aria-hidden="true"></span>
      <span id="heroCount">0 films</span>
    </div>
  </section>

  <section class="section reels-section" id="reels" hidden>
    <div class="section-head">
      <h2>Reels</h2>
      <p class="section-note">Vertical cuts — swipe →</p>
    </div>
    <div class="reels" id="reelTrack" role="list"></div>
  </section>

  <section class="section" id="work">
    <div class="section-head">
      <h2>Selected work</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="section about" id="about">
    <div class="about-grid">
      <div>
        <h2>About</h2>
        <p class="about-bio" id="aboutBio"></p>
        <ul class="socials" id="socials"></ul>
      </div>
      <ul class="facts" id="facts"></ul>
    </div>
  </section>

  <section class="section contact" id="contact">
    <h2 class="contact-title">Have a story to tell?</h2>
    <a class="mail" id="contactMail" href="#">hello@example.com</a>
  </section>
</main>

<footer class="footer">
  <span id="footerName">Your Name</span>
  <span class="footer-links">
    <a href="studio.html">Studio</a>
  </span>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <button class="lb-next" id="lbNext" aria-label="Next">›</button>
  <figure class="lb-stage">
    <video id="lbVideo" playsinline controls></video>
    <figcaption>
      <strong id="lbTitle"></strong>
      <span id="lbMeta"></span>
    </figcaption>
  </figure>
</div>

<script src="assets/js/site.js"></script>
</body>
</html>
